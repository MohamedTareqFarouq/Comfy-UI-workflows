[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vertical-video-studio"
version = "0.1.0"
description = "Local-first agentic vertical video studio for ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=13,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vertical-studio = "vertical_studio.cli:main"
vertical-studio-mcp = "vertical_studio.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vertical_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
