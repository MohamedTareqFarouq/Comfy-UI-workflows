<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131a"><title>Vertical Video Studio</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css?v=reference-upload-2">
</head><body>
<header><div><span class="eyebrow">LOCAL PRODUCTION</span><h1>Vertical Video Studio</h1></div>
<div class="header-actions"><a href="/observability.html">Observability</a><div id="runtime" class="status">Connecting...</div></div></header>
<main>
<aside>
<button id="new-project" class="primary">+ New project</button>
<div class="section-label">Projects</div><div id="projects"></div>
</aside>
<section id="workspace">
<div id="empty" class="empty"><div class="phone-frame"><div class="safe-area"></div></div>
<h2>Build a coherent vertical story</h2><p>Create a project to plan, approve, simulate, and render a 9:16 short.</p></div>
<div id="project-view" hidden></div>
</section></main>
<dialog id="create-dialog"><form id="create-form">
<h2>New vertical video</h2>
<label>Starting point<select name="source_mode" id="source-mode">
<option value="description">Describe and start from scratch</option>
<option value="reference">Start from a reference video</option>
</select></label>
<label id="reference-file-field" hidden>Reference video<input type="file" name="reference_file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska"></label>
<label>Title<input name="title" placeholder="Fogbound arrival"></label>
<label><span id="idea-label">Idea</span><textarea name="idea" required minlength="3" placeholder="Describe the story or concept..."></textarea></label>
<div class="row"><label>Duration<select name="duration_seconds"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></label>
<label>Style<input name="visual_style" value="cinematic 3D cartoon"></label></div>
<label class="check"><input type="checkbox" name="research_required"> This subject needs current factual research</label>
<label>Source URLs (optional, one per line)<textarea name="source_urls" placeholder="https://example.com/source"></textarea></label>
<div id="create-status" class="notice create-status" role="status" aria-live="polite" hidden></div>
<div class="actions"><button type="button" data-close>Cancel</button><button type="submit" class="primary">Create & plan</button></div>
</form></dialog>
<dialog id="retry-dialog"><form id="retry-form">
<input type="hidden" name="scene_id"><input type="hidden" name="asset_id"><input type="hidden" name="stage"><input type="hidden" name="revision_rationale">
<span class="eyebrow">GUIDED RETRY</span><h2 id="retry-title">Revise generation prompts</h2>
<p id="retry-description" class="dialog-copy"></p>
<div id="retry-status" class="notice retry-status" role="status" aria-live="polite" hidden></div>
<label id="retry-start-field">Start-keyframe prompt<textarea name="start_prompt" class="prompt-editor"></textarea></label>
<label id="retry-end-field">End-keyframe prompt<textarea name="end_prompt" class="prompt-editor"></textarea></label>
<label id="retry-video-field">Video prompt<textarea name="video_prompt" class="prompt-editor"></textarea></label>
<label id="retry-reference-field">Reference prompt<textarea name="reference_prompt" class="prompt-editor"></textarea></label>
<label id="retry-negative-field">Negative prompt<textarea name="negative_prompt" class="prompt-editor compact"></textarea></label>
<label>What was wrong?<textarea name="feedback" required minlength="2" placeholder="Describe the exact artifact, missing action, identity drift, or unwanted result."></textarea></label>
<div id="retry-rationale" class="notice" hidden></div>
<div class="actions"><button type="button" data-retry-close>Cancel</button><button type="button" id="revise-retry-prompts">Ask Qwen to revise</button><button type="submit" class="primary" disabled>Accept & regenerate</button></div>
</form></dialog>
<div id="toast"></div><script src="/app.js?v=reference-upload-2" defer></script>
</body></html>
