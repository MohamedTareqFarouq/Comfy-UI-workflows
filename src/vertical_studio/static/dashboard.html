<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>Agent Dashboard - Vertical Video Studio</title>
  <link rel="stylesheet" href="/styles.css?v=dashboard-2">
  <link rel="stylesheet" href="/dashboard.css?v=dashboard-2">
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">AGENT OPERATIONS</span>
      <h1>Production dashboard</h1>
    </div>
    <div class="header-actions">
      <a href="/">Studio</a>
      <a href="/observability.html">Observability</a>
      <div id="runtime" class="status">Connecting...</div>
    </div>
  </header>

  <main class="dashboard-shell">
    <section class="overview-grid" id="overview-grid"></section>

    <section class="runtime-panel">
      <div class="panel-header">
        <h2>Runtime &amp; capabilities</h2>
        <span id="runtime-readiness" class="badge">Checking</span>
      </div>
      <div id="runtime-meta" class="runtime-meta"></div>
      <div id="capability-list" class="capability-list"></div>
    </section>

    <section class="dashboard-grid">
      <aside class="dashboard-side">
        <div class="panel-header">
          <h2>Current queue</h2>
          <button id="dashboard-refresh" class="small-button">Refresh</button>
        </div>
        <div id="queue-panel" class="stack-panel"></div>
      </aside>

      <section class="dashboard-main">
        <div class="panel-header">
          <h2>Active project board</h2>
          <span id="dashboard-status" class="status">Live</span>
        </div>
        <div id="dashboard-content" class="card-grid"></div>
      </section>
    </section>
  </main>

  <script src="/dashboard.js?v=dashboard-2" defer></script>
</body>
</html>
